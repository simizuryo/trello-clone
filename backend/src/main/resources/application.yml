server:
  port: 8080

spring:
  application:
    name: trello-clone-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trello_clone}
    username: ${SPRING_DATASOURCE_USERNAME:trello}
    password: ${SPRING_DATASOURCE_PASSWORD:trello}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    # SQL is logged through the logger (org.hibernate.SQL below) instead of show-sql,
    # which writes straight to stdout and would bypass the JSON format and masking.
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.trelloclone: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:DEBUG}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  logging:
    # json (default) | plain
    format: ${LOG_FORMAT:json}
