server:
  port: 8080

spring:
  application:
    name: trello-clone-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/trello_clone
    username: trello
    password: trello
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origins: http://localhost:5173
