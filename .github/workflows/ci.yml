name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint / unit + integration / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trello_clone
          POSTGRES_USER: trello
          POSTGRES_PASSWORD: trello
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trello -d trello_clone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trello_clone
          POSTGRES_USER: trello
          POSTGRES_PASSWORD: trello
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trello -d trello_clone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build backend
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Install Playwright browser
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: app
        env:
          E2E_BACKEND_COMMAND: java -jar ../backend/target/trello-clone-backend-0.0.1-SNAPSHOT.jar
        run: npm run test:e2e
      - name: Upload failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            app/test-results/
            app/playwright-report/
          retention-days: 14
